server {
  listen 80;
  server_name _;
  
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: serve index.html so client-side routes (e.g. /leaderboards)
  # resolve instead of returning 404 on refresh / direct navigation.
  #
  # COOP/COEP go here, on the document response, to put the page in a
  # cross-origin isolated context — required for SharedArrayBuffer (vim.wasm).
  # Same-origin subresources (assets, .wasm) don't need these headers.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
  }

  # Ensure WebAssembly (vim.wasm) is served with the correct MIME type.
  location ~ \.wasm$ {
    default_type application/wasm;
  }

  # Hashed build assets are immutable — cache them aggressively.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
}
