repos:
  - repo: https://github.com/qoomon/git-conventional-commits
    rev: v2.9.0
    hooks:
      - id: conventional-commits

  # Local hooks reuse the tools pinned in package.json (single source of truth).
  # Both run repo-wide and auto-fix; if a file is changed or a warning survives,
  # the hook fails and the commit is aborted.
  - repo: local
    hooks:
      - id: eslint
        name: eslint (lint + autofix)
        entry: npm run lint:fix
        language: system
        files: \.(js|ts|tsx)$
        pass_filenames: false

      - id: prettier
        name: prettier (format)
        entry: npm run format
        language: system
        pass_filenames: false
        types_or: [javascript, jsx, ts, tsx, json, css, yaml, markdown]
